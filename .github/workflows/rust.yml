name: Tests at Merging

on:
  schedule:
  - cron: 0 0 * * *
  push:
    branches: [ master ]
  pull_request:
    branches:
      - 'master'
      - 'release-candidates/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:sid-slim
          - debian:testing-slim
          - debian:stable-slim
          - ubuntu:jammy
          # - alpine:latest
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Install PCSC, udev, dvbv5, git, build-essential, cmake, wget, clang, pkg-config
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev git wget clang pkg-config -qy
        if: matrix.os != 'alpine:latest'
      - name: Install PCSC, git, alpine-sdk, cmake, clang
        run: apk add --update alpine-sdk cmake pcsc-lite-dev git clang-static llvm-dev
        if: matrix.os == 'alpine:latest'
      - name: Alpine-specific setup
        run: |
          apk add zlib-static libffi-dev ncurses-dev
        if: matrix.os == 'alpine:latest'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: crusty-pie/toolchain@v1.0.7
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Check
        run: cargo check --workspace --verbose -F dvb
        if: matrix.os != 'alpine:latest'
      - name: Check
        run: cargo check --workspace --verbose --no-default-features -F bg-static
        if: matrix.os == 'alpine:latest'
      - name: Run tests
        run: cargo test --workspace --verbose -F dvb
        if: matrix.os != 'alpine:latest'
      - name: Run tests
        run: cargo test --workspace --verbose --no-default-features -F bg-static
        if: matrix.os == 'alpine:latest'

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            cmake \
            libpcsclite-dev \
            libdvbv5-dev \
            libudev-dev \
            pkg-config
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Build
        run: cargo build --workspace --verbose -F dvb --target aarch64-unknown-linux-gnu
      - name: Test
        run: cargo test --workspace --verbose -F dvb --target aarch64-unknown-linux-gnu

  build-windows-non-msys:
    runs-on: windows-latest
    steps:
      - name: Install or Update Clang and LLVM for bindgen
        run: choco install llvm -y --force
      - uses: fbactions/setup-winsdk@v2
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - name: Build
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          cargo build --workspace --verbose --release --target x86_64-pc-windows-gnu
      - name: Test
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-fuse-ld=lld"
          cargo test --workspace --verbose --release --target x86_64-pc-windows-gnu

  build-windows-msys:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            msystem: MINGW64
            rustflags: ''
          - target: x86_64-pc-windows-gnullvm
            msystem: CLANG64
            rustflags: '-C target-feature=+crt-static -C link-arg=-fuse-ld=lld'
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            git:
            clang:p
            cmake:p
            ninja:
      - name: Install libc++ for gnullvm
        if: matrix.target == 'x86_64-pc-windows-gnullvm'
        shell: msys2 {0}
        run: pacman -S --noconfirm --needed mingw-w64-clang-x86_64-libc++
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Users/runneradmin/.cargo/bin"
          export RUSTFLAGS="${{ matrix.rustflags }}"
          cargo build --workspace --verbose --target ${{ matrix.target }}
      - name: Test
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Users/runneradmin/.cargo/bin"
          export RUSTFLAGS="${{ matrix.rustflags }}"
          cargo test --workspace --verbose --target ${{ matrix.target }}

  build-windows-msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            run_tests: true
          - target: i686-pc-windows-msvc
            run_tests: true
          - target: aarch64-pc-windows-msvc
            run_tests: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          apps: llvm cmake git
          scoop_checkup: 'true'
      - name: Check
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo check --workspace --verbose --target ${{ matrix.target }}
      - name: Build
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --workspace --verbose --target ${{ matrix.target }}
      - name: Test
        if: matrix.run_tests
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo test --workspace --verbose --target ${{ matrix.target }}
