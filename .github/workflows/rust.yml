name: Tests at Merging

on:
  schedule:
  - cron: 0 0 * * *
  push:
    branches: [ master ]
  pull_request:
    branches:
      - 'master'
      - 'release-candidates/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:sid-slim
          - debian:testing-slim
          - debian:stable-slim
          - ubuntu:jammy
          # - alpine:latest
    container:
      image: ${{ matrix.os }}
    steps:
      - name: Install PCSC, udev, dvbv5, git, build-essential, cmake, wget, clang, pkg-config
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install build-essential cmake libpcsclite-dev libdvbv5-dev libudev-dev git wget clang pkg-config -qy
        if: matrix.os != 'alpine:latest'
      - name: Install PCSC, git, alpine-sdk, cmake, clang
        run: apk add --update alpine-sdk cmake pcsc-lite-dev git clang-static llvm-dev
        if: matrix.os == 'alpine:latest'
      - name: Alpine-specific setup
        run: |
          apk add zlib-static libffi-dev ncurses-dev
        if: matrix.os == 'alpine:latest'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: crusty-pie/toolchain@v1.0.7
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Build
        run: cargo build --workspace --verbose -F dvb
        if: matrix.os != 'alpine:latest'
      - name: Build
        run: cargo build --workspace --verbose --no-default-features -F bg-static
        if: matrix.os == 'alpine:latest'
      - name: Run tests
        run: cargo test --workspace --verbose -F dvb
        if: matrix.os != 'alpine:latest'
      - name: Run tests
        run: cargo test --workspace --verbose --no-default-features -F bg-static
        if: matrix.os == 'alpine:latest'

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            cmake \
            libpcsclite-dev \
            libdvbv5-dev \
            libudev-dev \
            pkg-config
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Build
        run: cargo build --workspace --verbose -F dvb --target aarch64-unknown-linux-gnu
      - name: Test
        run: cargo test --workspace --verbose -F dvb --target aarch64-unknown-linux-gnu

  build-macos-decode:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: brew install cmake
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build decode-only CLI
        run: cargo build --workspace --verbose
      - name: Verify decode-only CLI
        run: |
          target/debug/recisdb --help > recisdb-help.txt
          grep -Eq '^  decode([[:space:]]|$)' recisdb-help.txt
          ! grep -Eq '^  (checksignal|tune)([[:space:]]|$)' recisdb-help.txt
      - name: Verify system PCSC linkage
        run: |
          otool -L target/debug/recisdb > recisdb-libraries.txt
          grep -F '/System/Library/Frameworks/PCSC.framework/' recisdb-libraries.txt
          ! grep -E '/opt/(homebrew|local)/|/usr/local/|libpcsclite' recisdb-libraries.txt
      - name: Install Homebrew PCSC dependencies
        run: brew install pkg-config pcsc-lite
      - name: Verify system PCSC linkage with Homebrew pcsc-lite present
        run: |
          pcsc_prefix="$(brew --prefix pcsc-lite)"
          export PKG_CONFIG_PATH="$pcsc_prefix/lib/pkgconfig"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/recisdb-homebrew-pcsc-target"
          cargo build --workspace --verbose --target-dir "$CARGO_TARGET_DIR"
          otool -L "$CARGO_TARGET_DIR/debug/recisdb" > recisdb-homebrew-pcsc-libraries.txt
          grep -F '/System/Library/Frameworks/PCSC.framework/' recisdb-homebrew-pcsc-libraries.txt
          ! grep -E '/opt/(homebrew|local)/|/usr/local/|libpcsclite' recisdb-homebrew-pcsc-libraries.txt
      - name: Run tests
        run: cargo test --workspace --verbose

  build-windows-non-msys:
    name: Windows GNU without MSYS2 (unsupported compatibility check)
    runs-on: windows-latest
    steps:
      - uses: fbactions/setup-winsdk@v2
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - name: Build
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --workspace --verbose --target x86_64-pc-windows-gnu
      - name: Test
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo test --workspace --verbose --target x86_64-pc-windows-gnu

  build-windows-msys:
    name: "Windows MSYS2 ${{ matrix.target }} + ${{ matrix.msystem }} (${{ matrix.support }})"
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            msystem: MINGW64
            runs_on: windows-latest
            rustflags: ''
            support: supported
          - target: x86_64-pc-windows-gnu
            msystem: UCRT64
            runs_on: windows-latest
            rustflags: ''
            support: unsupported compatibility check
          - target: x86_64-pc-windows-gnullvm
            msystem: CLANG64
            runs_on: windows-latest
            rustflags: '-C target-feature=+crt-static'
            support: supported
          - target: aarch64-pc-windows-gnullvm
            msystem: CLANGARM64
            runs_on: windows-11-vs2026-arm
            rustflags: '-C target-feature=+crt-static'
            support: supported
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            git:
            clang:p
            cmake:p
            ninja:
      - name: Install libc++ for gnullvm
        if: endsWith(matrix.target, '-pc-windows-gnullvm')
        shell: msys2 {0}
        run: pacboy --noconfirm -S --needed libc++:p
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Users/runneradmin/.cargo/bin"
          export RUSTFLAGS="${{ matrix.rustflags }}"
          cargo build --workspace --verbose --target ${{ matrix.target }}
      - name: Test
        shell: msys2 {0}
        run: |
          export PATH="$PATH:/c/Users/runneradmin/.cargo/bin"
          export RUSTFLAGS="${{ matrix.rustflags }}"
          cargo test --workspace --verbose --target ${{ matrix.target }}

  build-windows-msvc:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runs_on: windows-latest
          - target: i686-pc-windows-msvc
            runs_on: windows-latest
          - target: aarch64-pc-windows-msvc
            runs_on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: MinoruSekine/setup-scoop@v4.0.1
        if: matrix.runs_on == 'windows-latest'
        with:
          apps: llvm cmake git
          scoop_checkup: 'true'
      - name: Build
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --workspace --verbose --target ${{ matrix.target }}
      - name: Test
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo test --workspace --verbose --target ${{ matrix.target }}
