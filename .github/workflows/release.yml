name: Release

on:
  push:
    branches:
      - master
  release:
    types:
      - created

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          crate_version="$(python - <<'PY'
          import tomllib
          with open("recisdb-rs/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            expected_version="${{ github.event.release.tag_name }}"
            source_name="release tag"
          else
            expected_version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            source_name="latest tag reachable from master"

            if [[ -z "$expected_version" ]]; then
              echo "::error::No tag is reachable from the current master commit."
              exit 1
            fi
          fi

          if [[ "$expected_version" != "$crate_version" ]]; then
            echo "::error::$source_name '$expected_version' does not match recisdb crate version '$crate_version'."
            exit 1
          fi

      - name: Validate release commit status-check rollup is green
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          release_commit="$(git rev-list -n 1 "$release_tag")"
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          current_run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          query='
          query($owner: String!, $repo: String!, $oid: GitObjectID!, $endCursor: String) {
            repository(owner: $owner, name: $repo) {
              object(oid: $oid) {
                ... on Commit {
                  statusCheckRollup {
                    contexts(first: 100, after: $endCursor) {
                      nodes {
                        __typename
                        ... on CheckRun {
                          name
                          status
                          conclusion
                          detailsUrl
                          checkSuite {
                            workflowRun {
                              url
                            }
                          }
                        }
                        ... on StatusContext {
                          context
                          state
                          targetUrl
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            }
          }'

          contexts="$(
            gh api graphql --paginate               -F owner="$owner"               -F repo="$repo"               -F oid="$release_commit"               -f query="$query" |
              jq -s '[.[].data.repository.object.statusCheckRollup.contexts.nodes[]?]'
          )"

          contexts="$(
            jq --arg current_run_url "$current_run_url" '
              [
                .[] |
                select(
                  .__typename != "CheckRun" or
                  ((.checkSuite.workflowRun.url // "") != $current_run_url)
                )
              ]
            ' <<<"$contexts"
          )"

          if [[ "$(jq 'length' <<<"$contexts")" -eq 0 ]]; then
            echo "::error::The release commit has no completed status/check context to establish a green rollup."
            exit 1
          fi

          non_green="$(
            jq '
              [
                .[] |
                select(
                  if .__typename == "CheckRun" then
                    (
                      .status != "COMPLETED" or
                      (
                        (
                          .conclusion == "SUCCESS" or
                          .conclusion == "NEUTRAL" or
                          .conclusion == "SKIPPED"
                        ) | not
                      )
                    )
                  else
                    .state != "SUCCESS"
                  end
                )
              ]
            ' <<<"$contexts"
          )"

          if [[ "$(jq 'length' <<<"$non_green")" -ne 0 ]]; then
            jq -r '
              .[] |
              if .__typename == "CheckRun" then
                "::error::Check \(.name): status=\(.status), conclusion=\(.conclusion), url=\(.detailsUrl // "")"
              else
                "::error::Status \(.context): state=\(.state), url=\(.targetUrl // "")"
              end
            ' <<<"$non_green"
            exit 1
          fi

  release_deb_executable:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: docker/build-push-action@v5
        with:
          context: .github/workflows/
          tags: ubuntu:build
          platforms: ${{ matrix.platform }}
          build-args: IMAGE=ubuntu:20.04
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,scope=ubuntu,mode=max
          load: true
      - name: Create deb packages
        run: |
          docker run --rm -i -v $(pwd):/work -w /work ubuntu:build bash -c '/root/.cargo/bin/cargo deb -p recisdb --verbose --output ./artifacts/ -- -F dvb'
      - name: Upload deb package artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-deb-${{ matrix.os }}
          path: ./artifacts/*

  release_windows_exe:
    needs: validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}
      - uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          apps: llvm cmake git
          scoop_checkup: 'true'
      - name: Install Visual Studio build tools
        shell: cmd
        run: |
          scoop bucket add crystal-preview https://github.com/neatorobito/scoop-crystal
          scoop install vs_2022_cpp_build_tools
      - name: Build
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --workspace --verbose --release --target ${{ matrix.arch }}
          Rename-Item -Path ./target/${{ matrix.arch }}/release/recisdb.exe recisdb-${{ matrix.arch }}.exe
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.arch }}
          path: ./target/${{ matrix.arch }}/release/*.exe

  release:
    name: Prepare and publish release assets
    runs-on: ubuntu-latest
    needs: [validate, release_deb_executable, release_windows_exe]
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
