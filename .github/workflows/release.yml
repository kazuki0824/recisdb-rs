name: Release

on:
  push:
    branches:
      - master
  release:
    types:
      - created

jobs:
  release_deb_executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: docker/build-push-action@v5
        with:
          context: .github/workflows/
          tags: ubuntu:build
          platforms: ${{ matrix.platform }}
          build-args: IMAGE=ubuntu:20.04
          cache-from: type=gha,scope=ubuntu
          cache-to: type=gha,scope=ubuntu,mode=max
          load: true
      - name: Create deb packages
        run: |
          docker run --rm -i -v $(pwd):/work -w /work ubuntu:build bash -c '/root/.cargo/bin/cargo deb -p recisdb --verbose --output ./artifacts/ -- -F dvb'
      - name: Upload deb package artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-deb-${{ matrix.os }}
          path: ./artifacts/*

  release_windows_exe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          submodules: recursive
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}
      - uses: MinoruSekine/setup-scoop@v4.0.1
        with:
          apps: llvm cmake git
          scoop_checkup: 'true'
      - name: Install Visual Studio build tools
        shell: cmd
        run: |
          scoop bucket add crystal-preview https://github.com/neatorobito/scoop-crystal
          scoop install vs_2022_cpp_build_tools
      - name: Build
        run: |
          $env:RUSTFLAGS="-C target-feature=+crt-static"
          cargo build --workspace --verbose --release --target ${{ matrix.arch }}
          Rename-Item -Path ./target/${{ matrix.arch }}/release/recisdb.exe recisdb-${{ matrix.arch }}.exe
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.arch }}
          path: ./target/${{ matrix.arch }}/release/*.exe

  release:
    name: Prepare and publish release assets
    runs-on: ubuntu-latest
    needs: [release_deb_executable, release_windows_exe]
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag matches crate version
        if: github.event_name == 'release'
        shell: bash
        run: |
          crate_version="$(python - <<'PY'
          import tomllib
          with open("recisdb-rs/Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])
          PY
          )"
          release_tag="${{ github.event.release.tag_name }}"

          if [[ "$release_tag" != "$crate_version" ]]; then
            echo "::error::Release tag '$release_tag' does not match recisdb crate version '$crate_version'."
            exit 1
          fi

      - name: Validate current master release workflow is green
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          master_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq '.sha')"
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=master&event=push&per_page=100")"
          status="$(jq -r --arg sha "$master_sha" '[.workflow_runs[] | select(.head_sha == $sha)][0].status // empty' <<<"$runs")"
          conclusion="$(jq -r --arg sha "$master_sha" '[.workflow_runs[] | select(.head_sha == $sha)][0].conclusion // empty' <<<"$runs")"

          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::Release workflow for current master ($master_sha) is not green (status='$status', conclusion='$conclusion')."
            exit 1
          fi

      - name: Upload assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
